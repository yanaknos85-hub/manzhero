components:
  schemas:
    Address:
      type: object
      description: Данные адреса
      required: 
        - id
        - country
        - region
        - latitude
        - longitude
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        country:
          type: string
          description: Страна
        region:
          type: string
          description: Регион или область
        city:
          type: string
          description: Город или населенный пункт
        street:
          type: string
          description: Улица
        house:
          type: string
          description: Номер дома
        building:
          type: string
          description: Номер корпуса
        structure:
          type: string
          description: Номер строения
        latitude:
          type: number
          format: double
          description: Широта
          minimum: -90
          maximum: 90
          multipleOf: 0.000001
        longitude:
          type: number
          format: double
          description: Долгота
          minimum: -180
          maximum: 180
          multipleOf: 0.000001
        count:
          type: integer
          description: Количество использований адреса. Указывается если адрес в списке часто используемых
          format: int32
        label:
          type: string
          description: Краткое описание адреса. Указывается если адрес в списке предпочитаемых.
    UserAddress:
      type: object
      description: Данные адреса вошедшего сотрудника
      required: 
        - id
        - country
        - region
        - latitude
        - longitude
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        country:
          type: string
          description: Страна
        region:
          type: string
          description: Регион или область
        city:
          type: string
          description: Город или населенный пункт
        street:
          type: string
          description: Улица
        house:
          type: string
          description: Номер дома
        building:
          type: string
          description: Номер корпуса
        structure:
          type: string
          description: Номер строения
        latitude:
          type: number
          format: double
          description: Широта
          minimum: -90
          maximum: 90
          multipleOf: 0.000001
        longitude:
          type: number
          format: double
          description: Долгота
          minimum: -180
          maximum: 180
          multipleOf: 0.000001
        usages:
          type: integer
          description: Количество использований адреса. Указывается если адрес в списке часто используемых
          format: int32
        first:
          type: boolean
          description: Флаг, указывающий на то, что адрес был первым в одной из поездок
        label:
          type: string
          description: Краткое описание адреса. Указывается если адрес в списке предпочитаемых.
    NewAddress:
      type: object
      description: Новые данные адреса
      required: 
        - country
        - region
        - label
      properties:
        country:
          type: string
          description: Страна
        region:
          type: string
          description: Регион или область
        city:
          type: string
          description: Город или населенный пункт
        street:
          type: string
          description: Улица
        house:
          type: string
          description: Номер дома
        building:
          type: string
          description: Номер корпуса
        structure:
          type: string
          description: Номер строения
        latitude:
          type: number
          format: double
          description: Широта
          minimum: -90
          maximum: 90
          multipleOf: 0.000001
        longitude:
          type: number
          format: double
          description: Долгота
          minimum: -180
          maximum: 180
          multipleOf: 0.000001
    NewFavoriteAddress:
      type: object
      description: Новые данные адреса
      required: 
        - country
        - region
        - latitude
        - longitude
        - label
      properties:
        country:
          type: string
          description: Страна
        region:
          type: string
          description: Регион или область
        city:
          type: string
          description: Город или населенный пункт
        street:
          type: string
          description: Улица
        house:
          type: string
          description: Номер дома
        building:
          type: string
          description: Номер корпуса
        structure:
          type: string
          description: Номер строения
        latitude:
          type: number
          format: double
          description: Широта
          minimum: -90
          maximum: 90
          multipleOf: 0.000001
        longitude:
          type: number
          format: double
          description: Долгота
          minimum: -180
          maximum: 180
          multipleOf: 0.000001
        label:
          type: string
          description: Краткое описание адреса. Указывается если адрес в списке предпочитаемых.
    NewMeetingAddress:
      description: Новые данные адреса встречи
      required:
        - label
        - address
      properties:
        label:
          description: Краткое описание адреса
          type: string
        address:
          $ref: '#/components/schemas/NewAddress'
    MeetingAddress:
      description: Данные адреса встречи
      required:
        - label
        - address
        - id
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        organizationId:
          $ref: '#/components/schemas/UUID'
        label:
          description: Краткое описание адреса
          type: string
        address:
          $ref: '#/components/schemas/NewAddress'
