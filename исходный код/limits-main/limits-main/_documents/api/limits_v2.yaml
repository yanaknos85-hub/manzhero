      responses:
        200:
          description: Ок
        400:
          description: Один из параметров запроса некорректен
        401:
          description: Не авторизован
        403:
          description: Нет прав
        404:
          description: Один или несколько ресурсов не найдено
    patch:
      security:
        - BearerToken: []
      tags:
        - Лимиты
      description: Частичное изменение лимита
      summary: Частичное изменение лимита
      parameters:
        - in: path
          name: limitId
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      requestBody:
        content:
          application/json:
            schema:
              title: Новые данные лимита
              type: array
              items:
                properties:
                  field:
                    type: string
                    format: enum
                    title: Наименование поля для изменения
                    enum:
                      - finalSharing
                      - useThisLimit
                      - limitStatus
                  value:
                    title: Новое значение поля
                    oneOf:
                      - type: boolean
                        title: Логическое значение. Применимо для useThisLimit и finalSharing
                      - title: Новое значение статуса. Применимо для limitStatus
                        type: string
                        allOf:
                          - $ref: '#/components/schemas/LimitStatus'
      responses:
        200:
          description: Ок
        400:
          description: Один из параметров запроса некорректен
        401:
          description: Не авторизован
        403:
          description: Нет прав
        404:
          description: Один или несколько ресурсов не найдено
