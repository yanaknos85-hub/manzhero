              $ref: '#/components/schemas/LimitReSharingByTransportTypeV2DTO'
      responses:
        200:
          description: Ок
        400:
          description: Один из параметров запроса некорректен
        401:
          description: Не авторизован
        403:
          description: Нет прав
        404:
          description: Один или несколько ресурсов не найдено
