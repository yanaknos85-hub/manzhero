openapi: 3.0.3
info:
  title: Лимиты
  description: Сервис по управлению лимитами
  version: "2"
servers:
  - url: '{scheme}://{host}:{port}/api/limits'
    description: Адрес для вызова
    variables:
      scheme:
        default: http
        enum:
          - http
          - https
      host:
        default: localhost
      port:
        default: "80"
        enum:
          - "80"
          - "8080"
          - "443"
          - "8443"
paths:
  /organization/{organizationId}/department:
    summary: Лимиты подразделений
    post:
      security:
        - BearerToken: []
      tags:
        - Лимиты подразделений
      description: Добавление нового лимита подразделения
      summary: Добавление нового лимита подразделения
      parameters:
        - in: path
          name: organizationId
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepLimitPrimaryV2DTO'
      responses:
        200:
          description: Ок
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetLimitV2DTO'
        400:
          description: Один из параметров запроса некорректен
        401:
          description: Не авторизован
        403:
          description: Нет прав
        404:
          description: Один или несколько ресурсов не найдено
  /:
    summary: Лимиты
    get:
      security:
        - BearerToken: []
      tags:
        - Лимиты
      description: Получение лимитов
      summary: Получение лимитов
      parameters:
        - in: query
          name: page
          schema:
            type: number
            default: 0
        - in: query
          name: size
          schema:
            type: number
            default: 20
        - in: query
          name: direction
          schema:
            type: string
            format: enum
            default: 'ASC'
            enum:
              - ASC
              - DESC
        - name: limitType
          schema:
            $ref: '#/components/schemas/LimitType'
          in: query
        - name: departmentId
          schema:
            $ref: '#/components/schemas/UUID'
          in: query
        - name: parentLimitId
          schema:
            $ref: '#/components/schemas/UUID'
          in: query
        - name: organizationId
          schema:
            $ref: '#/components/schemas/UUID'
          in: query
        - name: employeeId
          schema:
            $ref: '#/components/schemas/UUID'
          in: query
        - name: requestId
          schema:
            $ref: '#/components/schemas/UUID'
          in: query
        - name: year
          schema:
            type: number
          in: query
        - name: limitServiceType
          schema:
            $ref: '#/components/schemas/LimitServiceType'
          in: query
        - name: parentDepartment
          description: Распределяющее подразделение
          schema:
            type: string
          in: query
        - name: limitOwner
          description: Владелец лимита
          schema:
            type: string
          in: query
        - name: humanReadableLimitId
          description: Человекочитаемый идентификатор лимита
          schema:
            $ref: '#/components/schemas/HumanReadableId'
          in: query
        - name: limitStatus
          description: Статус лимита
          schema:
            $ref: '#/components/schemas/LimitStatus'
          in: query
        - name: myAuthored
          description: Авторства вошедшего
          schema:
            type: boolean
          in: query
        - name: myApproved
          description: Согласования вошедшего
          schema:
            type: boolean
          in: query
      responses:
        200:
          description: Ок
          content:
            application/json:
              schema:
                type: object
                title: Лимиты
                properties:
                  number:
                    title: Номер страницы
                    type: number
                  totalPages:
                    title: Всего страниц
                    type: number
                  totalElements:
                    title: Всего элементов
                    type: number
                  size:
                    title: Размер страницы
                    type: number
                  numberOfElements:
                    title: Количество элементов
                    type: number
                  hasContent:
                    title: Флаг наличия контента
                    type: boolean
                  isFirst:
                    title: Флаг первой страницы
                    type: boolean
                  isLast:
                    title: Флаг последней страницы
                    type: boolean
                  hasNext:
                    title: Флаг наличия следующей страницы
                    type: boolean
                  hasPrevious:
                    title: Флаг наличия предыдущей страницы
                    type: boolean
                  content:
                    $ref: '#/components/schemas/GetLimitV2DTO'
        400:
          description: Один из параметров запроса некорректен
        401:
          description: Не авторизован
        403:
          description: Нет прав
        404:
          description: Один или несколько ресурсов не найдено
  /transport-type/reshare:
    summary: Перераспределение лимитов типов транспорта
    put:
