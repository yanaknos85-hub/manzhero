        400:
          description: Один из параметров запроса некорректен
        401:
          description: Не авторизован
        403:
          description: Нет прав
        404:
          description: Один или несколько ресурсов не найдено
    put:
      security:
        - BearerToken: []
      tags:
        - Лимиты
      description: Изменение лимита
      summary: Изменение лимита
      parameters:
        - in: path
          name: limitId
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      requestBody:
        content:
