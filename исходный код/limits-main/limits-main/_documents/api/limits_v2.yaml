components:
  schemas:
    DepLimitPrimaryV2DTO:
      type: object
      title: Лимит
      description: Входные данные для создания лимита лимита
      required:
        - year
        - limitServiceType
        - limitSharingType
        - sum
      properties:
        year:
          type: number
          title: Год
          minimum: 1970
        limitSharingType:
          $ref: '#/components/schemas/LimitSharingType'
        limitServiceType:
          $ref: '#/components/schemas/LimitServiceType'
        sum:
          type: number
          title: Сумма в копейках
          minimum: 0
        parentId:
          title: Родительский лимит
          allOf:
            - $ref: '#/components/schemas/UUID'
        finalSharing:
          title: Конечное распределение
          default: false
          type: boolean
        useThisLimit:
          title: Использовать лимит моего подразделения
          default: false
          type: boolean
    ChildLimitShardingPerPeriodV2DTO:
      type: object
      title: Дочернее распределение
      description: Дочернее распределение
      properties:
        id:
          title: Идентификатор распределения
          type: string
          format: uuid
          pattern: "[\\da-f]{8}(-[\\da-f]{4}){3}-[\\da-f]{12}"
        authorId:
          title: Идентификатор автора
          type: string
          format: uuid
          pattern: "[\\da-f]{8}(-[\\da-f]{4}){3}-[\\da-f]{12}"
        creationTime:
          title: Время создания
          type: string
          format: datetime
          pattern: yyyy-MM-ddTHH:mm:ss.sss
        sum:
          title: Выделенная сумма
          type: number
          format: long
        balance:
          title: Израсходовано
          type: number
          format: long
        period:
          title: Период распределения
          oneOf:
            - $ref: '#/components/schemas/Month'
            - $ref: '#/components/schemas/Quarter'
        limitSharingId:
          title: Идентификатор распределения
          type: string
          format: uuid
          pattern: "[\\da-f]{8}(-[\\da-f]{4}){3}-[\\da-f]{12}"
        organizationId:
          title: Идентификатор организации
          type: string
          format: uuid
          pattern: "[\\da-f]{8}(-[\\da-f]{4}){3}-[\\da-f]{12}"
    DepLimitRequestV2DTO:
      type: object
      title: Заявка на лимит подразделения
      description: Заявка на лимит подразделения
      required:
        - year
        - period
        - transportType
        - sum
      properties:
        year:
          title: Год распределения
          type: number
          format: int4
        period:
          title: Период распределения
          oneOf:
            - $ref: '#/components/schemas/Month'
            - $ref: '#/components/schemas/Quarter'
        transportType:
          $ref: '#/components/schemas/TransportType'
        sum:
          title: Сумма
          type: number
          format: int8
        description:
          title: Описание
          type: string
        askTargets:
          $ref: '#/components/schemas/LimitRequestAskTargets'
        departments:
          type: array
          title: Подразделения
          items:
            title: Идентификатор подразделения
            type: string
            format: uuid
            pattern: "[\\da-f]{8}(-[\\da-f]{4}){3}-[\\da-f]{12}"
    GetDepLimitRequestV2DTO:
      type: object
      title: Заявка на лимит подразделения (Чтение)
      description: Заявка на лимит подразделения
      required:
        - id
        - humanReadableId
        - year
        - period
        - transportType
        - sum
      properties:
        id:
          title: Идентификатор
          type: string
          format: uuid
          pattern: "[\\da-f]{8}(-[\\da-f]{4}){3}-[\\da-f]{12}"
        authorId:
          title: Идентификатор автора
          type: string
          format: uuid
          pattern: "[\\da-f]{8}(-[\\da-f]{4}){3}-[\\da-f]{12}"
        humanReadableId:
          title: Человекочитаемый идентификатор
          type: string
          format: string
          pattern: "\\w{2}-\\d{4}-\\d{8}"
        year:
          title: Год распределения
          type: number
          format: int4
        period:
          title: Период распределения
          oneOf:
            - $ref: '#/components/schemas/Month'
            - $ref: '#/components/schemas/Quarter'
        transportType:
          $ref: '#/components/schemas/TransportType'
        sum:
          title: Сумма
          type: number
          format: int8
        description:
          title: Описание
          type: string
        declineReason:
          title: Причина отказа
          type: string
        approvalState:
          $ref: '#/components/schemas/ApprovalState'
        status:
          $ref: '#/components/schemas/LimitRequestStatus'
        creationTime:
          title: Дата создания
          type: string
          format: datetime
          pattern: yyyy-MM-ddTHH:mm:ss.sss
        askTargets:
          $ref: '#/components/schemas/LimitRequestAskTargets'
        departments:
          type: array
          title: Подразделения
          items:
            title: Идентификатор подразделения
            type: string
            format: uuid
            pattern: "[\\da-f]{8}(-[\\da-f]{4}){3}-[\\da-f]{12}"
