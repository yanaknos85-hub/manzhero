  - changeSet:
      id: "20250128-1051"
      author: medvedev-ad
      context: "TRANSPORT-25492"
      changes:
        - tagDatabase:
            tag: "D-04.002.000"
        - dropForeignKeyConstraint:
            baseTableName: method_roles
            baseTableSchemaName: limits
            constraintName: method_roles_method_id_fkey
        - dropTable:
            schemaName: limits
            tableName: transport_type
        - dropTable:
            schemaName: limits
            tableName: methods
        - dropTable:
            schemaName: limits
            tableName: method_roles
      rollback:
        - createTable:
            schemaName: limits
            tableName: transport_type
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: transport_type_pkey
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
                    notNullConstraintName: limits_transport_type_name_nn
                    unique: true
                    uniqueConstraintName: transport_type_name_key
        - createTable:
            schemaName: limits
            tableName: methods
            remarks: Информация о методах
            columns:
              - column:
                  name: id
                  type: uuid
                  remarks: ID метода
                  constraints:
                    primaryKey: true
                    primaryKeyName: methods_pkey
              - column:
                  name: name
                  type: varchar
                  remarks: Наименование метода
                  constraints:
                    nullable: false
                    notNullConstraintName: limits_methods_name_nn
                    unique: true
                    uniqueConstraintName: methods_name_key
              - column:
                  name: description
                  type: varchar
                  remarks: Описание метода
        - createTable:
            schemaName: limits
            tableName: method_roles
            remarks: Связи методов и ролей
            columns:
              - column:
                  name: id
                  type: uuid
                  remarks: ID связи
                  constraints:
                    primaryKey: true
                    primaryKeyName: method_roles_pkey
              - column:
                  name: method_id
                  type: uuid
                  remarks: ID метода
              - column:
                  name: role_code
                  type: varchar
                  remarks: Наименование роли
        - addUniqueConstraint:
            schemaName: limits
            tableName: method_roles
            columnNames: method_id, role_code
            constraintName: method_roles_role_method_uk
        - addForeignKeyConstraint:
            baseTableSchemaName: limits
            baseTableName: method_roles
            baseColumnNames: method_id
            referencedTableSchemaName: limits
            referencedTableName: methods
            referencedColumnNames: id
            constraintName: method_roles_method_id_fkey
