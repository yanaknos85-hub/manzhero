databaseChangeLog:
  - changeSet:
      id: "20250128-0858"
      author: medvedev-ad
      context: "TRANSPORT-25492"
      changes:
        - tagDatabase:
            tag: "D-04.002.000"
        - sql:
            sql: create type limits.status as enum('SHARED', 'PLANNING', 'CLOSED');
        - sql:
            sql: create type limits.type as enum('EMPLOYEE', 'DEPARTMENT');
        - sql:
            sql: create type limits.sharing_type as enum('MONTHLY', 'QUARTER', 'PERCENTS');
        - sql:
            sql: create type limits.service_type as enum('PASSENGER', 'CARGO', 'REPAIR');
        - sql:
            sql: create type limits.spending_status as enum('SPENT', 'RESERVED', 'CANCELED');
      rollback:
        - sql:
            sql: drop type limits.status;
        - sql:
            sql: drop type limits.type;
        - sql:
            sql: drop type limits.sharing_type;
        - sql:
            sql: drop type limits.service_type;
        - sql:
            sql: drop type limits.spending_status;
  - changeSet:
      id: "20250128-0900"
      author: medvedev-ad
      context: "TRANSPORT-25492"
      dbms: postgresql
      changes:
        - tagDatabase:
            tag: "D-04.002.000"
        - sql:
            dbms: postgresql
            sql: drop materialized view limits.limit_stats_spending
        - sql:
            dbms: postgresql
            sql: drop materialized view limits.limit_stats
        - sql:
            sql: DROP INDEX limits.limits_limit_year_limit_service_type_department_status_uk;
      rollback:
        - sql:
            dbms: postgresql
            sql: >-
              create materialized view limits.limit_stats as
              SELECT lspp.id AS period_sharing_id,
                  l.organization_id as organization_id,
                  lspp.period,
                  l.year,
                  ls.id AS sharing_id,
                  ls.transport_type,
                  lspp.sum
                 FROM limits.limit_sharing_per_period lspp
                   JOIN limits.limit_sharing ls ON ls.id = lspp.limit_sharing_id
                   JOIN limits."limit" l ON l.id = ls.limit_id
                WHERE l.limit_status::text = 'SHARED'::text AND lspp.sum > 0;
        - sql:
            dbms: postgresql
            sql: >-
              create materialized view limits.limit_stats_spending as
              SELECT limit_stats.sharing_id,
                  limit_stats.period_sharing_id,
                  limit_stats.organization_id,
                  limit_stats.year,
                  limit_stats.transport_type,
                  limit_stats.period,
                  limit_spending.sum_spent,
                  limit_spending.request_id
                 FROM limits.limit_stats
                   JOIN limits.limit_spending ON limit_stats.period_sharing_id = limit_spending.limit_sharing_per_period_id
                WHERE limit_spending.limit_spending_status::text = 'SPENT'::text AND limit_spending.sum_spent > 0
                ORDER BY limit_stats.sharing_id, limit_stats.period_sharing_id;
        - sql:
            sql: CREATE UNIQUE INDEX limits_limit_year_limit_service_type_department_status_uk ON limits."limit" (limit_status, year, department_id, limit_service_type) WHERE (((limit_status)::text <> 'CLOSED'::text) AND (year >= 2024));
