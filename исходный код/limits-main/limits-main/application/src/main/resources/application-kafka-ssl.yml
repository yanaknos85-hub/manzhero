spring.cloud:
  stream:
    kafka:
      binder:
        brokers:
          - ${KAFKA_BROKERS}
      default:
        consumer:
          enableDlq: true
          topic.properties:
            cleanup.policy: compact,delete
            retention.ms: 604800000
        producer:
          topic.properties:
            cleanup.policy: compact,delete
            retention.ms: 604800000
      bindings:
        employeesInputDlqSsl-in-0:
          consumer:
            enableDlq: false
        departmentsInputDlqSsl-in-0:
          consumer:
            enableDlq: false
        organizationsInputDlqSsl-in-0:
          consumer:
            enableDlq: false
    binders:
      kafka:
        type: kafka
    default-binder: kafka-ssl
    bindings:
      organizationsInputSsl-in-0:
        group: ${spring.application.name}-ssl
        destination: service.organization
      organizationsInputDlqSsl-in-0:
        group: ${spring.application.name}-ssl
        destination: error.${spring.cloud.stream.bindings.organizationsInputSsl-in-0.destination}.${spring.application.name}
        consumer:
          maxAttempts: 10
          backOffInitialInterval: 30000
          backOffMultiplier: 2
          backOffMaxInterval: 3000000
      departmentsInputSsl-in-0:
        group: ${spring.application.name}-ssl
        destination: service.organization.department
      departmentsInputDlqSsl-in-0:
        group: ${spring.application.name}-ssl
        destination: error.${spring.cloud.stream.bindings.departmentsInputSsl-in-0.destination}.${spring.application.name}
        consumer:
          maxAttempts: 10
          backOffInitialInterval: 30000
          backOffMultiplier: 2
          backOffMaxInterval: 3000000
      employeesInputSsl-in-0:
        group: ${spring.application.name}-ssl
        destination: service.organization.employee
      employeesInputDlqSsl-in-0:
        group: ${spring.application.name}-ssl
        destination: error.${spring.cloud.stream.bindings.employeesInputSsl-in-0.destination}.${spring.application.name}
        consumer:
          maxAttempts: 10
          backOffInitialInterval: 30000
          backOffMultiplier: 2
          backOffMaxInterval: 3000000
      emailOutputSsl-out-0:
        group: ${spring.application.name}-ssl
        destination: service.email.output
      deadlineSettingsInputSsl-in-0:
        group: ${spring.application.name}-ssl
        destination: service.organization.deadlineSettings
      limitSpendInputSsl-in-0:
        group: ${spring.application.name}-ssl
        destination: service.limits.spend
        consumer:
          maxAttempts: 1
          defaultRetryable: false
