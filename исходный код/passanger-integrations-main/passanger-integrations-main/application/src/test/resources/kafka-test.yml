spring.cloud.stream:
    kafka:
        binder:
            producerProperties:
                key.serializer: org.springframework.kafka.support.serializer.JsonSerializer
            consumerProperties:
                key.deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
                spring.json.trusted.packages: java.util,java.lang,java.time
    default-binder: integration
    bindings:
        carLocationRequestInput-in-0:
            group: ${spring.application.name}
            destination: service.request.car-location-request
        carLocationResponseOutput-out-0:
            group: ${spring.application.name}
            destination: service.response.car-location-response
        contractorTaxiTripInput-in-0:
            group: ${spring.application.name}
            destination: service.integrations.contractor.trip
        inContractorTaxiTripInProgressOutput-out-0:
            destination: service.integrations.contractor.trip.inprogress