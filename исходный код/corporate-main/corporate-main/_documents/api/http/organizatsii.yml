openapi: 3.0.3
info:
  title: Платформа - Организации
  version: 4.21.0
  description: Набор операций по работе с оргштатной структурой
servers:
  - url: '{scheme}://{host}:{port}{api}'
    description: Адрес для вызова
    variables:
      scheme:
        enum:
          - http
          - https
        default: http
      host:
        default: localhost
      api:
        default: /api/organizations/v4.8/
      port:
        enum:
          - '80'
          - '8080'
          - '443'
          - '8443'
        default: '80'
paths:
  /:
    summary: Организации
    description: Операции с организациями
    post:
      summary: Добавить
      description: Добавить организацию
      tags:
        - organizationsCommands
      operationId: add
      requestBody:
        $ref: '#/components/requestBodies/Organization'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /self:
    summary: Иформация о себе
    description: Информация о вошедшем пользователе
    get:
      summary: Получить
      description: Получить информацию о вошедшем пользователе
      tags:
        - employeesQuery
      operationId: get
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /employees:
    summary: Информация о сотрудниках
    description: Сотрудники
    get:
      summary: Получить
      description: Получить список сотрудников
      tags:
        - employeesQuery
      security:
        - BearerToken: []
      parameters:
        - in: query
          required: false
          name: organizations
          description: Организации
          schema:
            type: array
            items:
              title: Идентификатор
              type: string
              format: uuid
        - in: query
          required: false
          name: departments
          description: Подразделения
          schema:
            type: array
            items:
              title: Идентификатор
              type: string
              format: uuid
        - in: query
          required: false
          name: employees
          description: Сотрудники
          schema:
            type: array
            items:
              title: Идентификатор
              type: string
              format: uuid
        - in: query
          required: false
          name: fullName
          description: Полное имя
          schema:
            type: string
        - in: query
          required: false
          name: personnelNumber
          description: Табельный номер
          schema:
            type: string
        - in: query
          required: false
          name: humanReadableId
          description: Человекочитаемый идентификатор
          schema:
            type: string
        - in: query
          required: false
          name: status
          description: Статус
          schema:
            $ref: '#/components/schemas/ActiveStatus'
        - in: query
          required: false
          name: mobilePhone
          description: Номер телефона
          schema:
            type: string
        - in: query
          required: false
          name: email
          description: Адрес электронной почты
          schema:
            $ref: '#/components/schemas/Email'
        - in: query
          required: false
          name: orgStructureType
          description: Тип оргштатной структуры
          schema:
            $ref: '#/components/schemas/OrgStructureType'
        - in: query
          name: projection
          description: Проекция
          required: false
          schema:
            $ref: '#/components/schemas/Projection'
        - in: query
          name: page
          required: false
          description: Страница
          schema:
            type: integer
            default: 0
            minimum: 0
        - in: query
          name: size
          required: false
          description: Размер страницы
          schema:
            type: integer
            default: 20
            minimum: 1
        - in: query
          name: sort
          required: false
          description: Поле для сортировки
          schema:
            type: string
        - in: query
          name: direction
          required: false
          description: Направление сортировки
          schema:
            format: enum
            description: |
              Направление сортировки.
              *ASC* - по возрастанию
              *DESC* - по убыванию
            enum:
              - ASC
              - DESC
            type: string
            title: SortDirection
            default: ASC
      responses:
        '200':
          $ref: '#/components/responses/EmployeesPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /{organizationId}/departments/{departmentId}/employees:
    parameters:
      - in: path
        name: organizationId
        description: Идентификатор организации
        schema:
          title: Идентификатор
          type: string
          format: uuid
        required: true
      - in: path
        name: departmentId
        description: Идентификатор подразделения
        schema:
          title: Идентификатор
          type: string
          format: uuid
        required: true
    summary: Работа с сотрудниками
    description: Список операций по работе с сотрудниками
    post:
      tags:
        - employeesCommand
      operationId: create
      summary: Добавление сотрудника
      description: Добавление информации о новом сотруднике
      requestBody:
        $ref: '#/components/requestBodies/Employee'
      responses:
        '201':
          $ref: '#/components/responses/EmployeeCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /{organizationId}/departments/{departmentId}/employees/{employeeId}:
    parameters:
      - in: path
        name: organizationId
        description: Идентификатор организации
        schema:
          title: Идентификатор
          type: string
          format: uuid
        required: true
      - in: path
        name: departmentId
        description: Идентификатор подразделения
        schema:
          title: Идентификатор
          type: string
          format: uuid
        required: true
      - in: path
        name: employeeId
        description: Идентификатор сотрудника
        schema:
          title: Идентификатор
          type: string
          format: uuid
        required: true
    summary: Операции с сотрудниками
    description: Операции с конкретными сотрудниками
    put:
      tags:
        - employeesCommand
      operationId: edit
      summary: Изменение сотрудника
      description: Изменение данных конкретного сотрудника
      parameters:
        - in: header
          name: If-Unmodified-Since
          description: Применить обновление данных только в случае если объект не менялся с даты. Если не указано, берется дата запроса
          required: false
          schema:
            title: Время в формате JS
            description: Время в формате JS для использования в заголовках
            type: string
            format: date-time
            example: Sat, 01 Mar 2025 09:50:00 GMT
      requestBody:
        $ref: '#/components/requestBodies/Employee'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/Precondition'
    patch:
      tags:
        - employeesCommand
      operationId: partially
      summary: Частичное изменение сотрудника
      description: Изменение части данных конкретного сотрудника
      parameters:
        - in: header
          name: If-Unmodified-Since
          description: Применить обновление данных только в случае если объект не менялся с даты. Если не указано, берется дата запроса
          required: false
          schema:
            title: Время в формате JS
            description: Время в формате JS для использования в заголовках
            type: string
            format: date-time
            example: Sat, 01 Mar 2025 09:50:00 GMT
      requestBody:
        $ref: '#/components/requestBodies/Patch'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/Precondition'
    delete:
      tags:
        - employeesCommand
      operationId: delete
      summary: Удаление сотрудника
      description: Удаление данных конкретного сотрудника
      parameters:
        - in: header
          name: If-Unmodified-Since
          description: Применить обновление данных только в случае если объект не менялся с даты. Если не указано, берется дата запроса
          required: false
          schema:
            title: Время в формате JS
            description: Время в формате JS для использования в заголовках
            type: string
            format: date-time
            example: Sat, 01 Mar 2025 09:50:00 GMT
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/Precondition'
components:
  responses:
    Accepted:
      description: Запрос принят, изменения в системе
      headers:
        etag:
          description: Хэш объекта
          schema:
            type: string
        last-modified:
          description: Время когда изменился объект
          schema:
            title: Время в формате JS
            description: Время в формате JS для использования в заголовках
            type: string
            format: date-time
            example: Sat, 01 Mar 2025 09:50:00 GMT
    Precondition:
      description: Запрос не прошел по предусловию, например, объект поменялся с указанной даты
    EmployeesPage:
      description: Страница сотрудников
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmployeePage'
    EmployeeCreated:
      description: Создан сотрудник
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmployeeData'
      headers:
        etag:
          description: Хэш объекта
          schema:
            type: string
        last-modified:
          description: Дата изменения
          schema:
            title: Время в формате JS
            description: Время в формате JS для использования в заголовках
            type: string
            format: date-time
            example: Sat, 01 Mar 2025 09:50:00 GMT
    Unauthorized:
      description: Ошибка авторизации
    Forbidden:
      description: Нет доступа
    NotModified:
      description: Не изменено
    NotFound:
      description: Нет ресурса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFound'
    Conflict:
      description: Ресурс конфликтует с существующим
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Conflict'
  requestBodies:
    Patch:
      required: true
      description: Данные для частичного изменения
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Patch'
    Organization:
      required: true
      description: Данные организации
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NewOrganizationData'
    Employee:
      required: true
      description: Данные нового сотрудника
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NewEmployeeData'
  schemas:
    NewEmployeeData:
      title: Новые сотрудник
      description: Новые данные сотрудника
      required:
        - firstName
        - lastName
        - personnelNumber
        - positionId
        - email
      properties:
        firstName:
          type: string
          title: Имя
          description: Имя нового пользователя
          maxLength: 20
          minimum: 2
        lastName:
          title: Фамилия
          description: Фамилия нового пользователя
          type: string
          minLength: 2
          maxLength: 30
        patronymic:
          title: Отчество
          description: Отчество нового пользователя
          minLength: 2
          maxLength: 30
          type: string
        personnelNumber:
          title: ТН
          description: Табельный номер сотрудника
          minLength: 1
          maxLength: 10
          type: string
        positionId:
          title: Должность
          description: Идентификатор должности
          allOf:
            - title: Идентификатор
              type: string
              format: uuid
        mobilePhone:
          title: Телефон
          description: Номер телефона
          type: string
          format: phone
          pattern: ^()||(\+7|8)\d{10}$
        email:
          title: E-Mail
          description: Адрес электронной почты сотрудника
          allOf:
            - $ref: '#/components/schemas/Email'
        supervisorId:
          title: Руководитель
          description: Идентификатор руководителя
          allOf:
            - title: Идентификатор
              type: string
              format: uuid
        roles:
          title: Роли
          description: Список ролей
          type: array
          items:
            type: string
        attributes:
          title: Атрибуты
          description: Список атрибутов сотрудника
          type: array
          items:
            $ref: '#/components/schemas/Attribute'
        status:
          title: Статус активности
          description: Активность сотрудника
          allOf:
            - $ref: '#/components/schemas/ActiveStatus'
    EmployeePage:
      title: Страница сотрудников
      description: Описание страницы сотрудников
      required:
        - content
        - page
        - sort
      properties:
        content:
          title: Сотрудники
          description: Массив сотрудников
          type: array
          items:
            $ref: '#/components/schemas/EmployeeData'
        sort:
          $ref: '#/components/schemas/Sort'
        page:
          $ref: '#/components/schemas/Page'
    EmployeeData:
      type: object
      title: Сотрудник
      description: Информация о сотруднике
      properties:
        id:
          title: Идентификатор
          type: string
          format: uuid
        userId:
          title: Идентификатор
          type: string
          format: uuid
        firstName:
          title: Имя
          type: string
          description: Имя
        lastName:
          title: Фамилия
          type: string
          description: Фамилия
        patronymic:
          title: Отчество
          type: string
          description: Отчество
        personnelNumber:
          title: ТН
          type: string
          description: Табельный номер
        positionId:
          title: Идентификатор
          type: string
          format: uuid
        mobilePhone:
          title: Мобильный
          type: string
          description: Мобильный номер телефона
        email:
          $ref: '#/components/schemas/Email'
        supervisorId:
          title: Идентификатор
          type: string
          format: uuid
        departmentId:
          title: Идентификатор
          type: string
          format: uuid
        organizationId:
          title: Идентификатор
          type: string
          format: uuid
        positionName:
          title: Должность
          description: Название должности сотрудника. Используйте запрос получения должности по идентификатору
          deprecated: true
          type: string
        status:
          $ref: '#/components/schemas/ActiveStatus'
        attributes:
          title: Атрибуты
          description: Список атрибутов сотрудника
          type: array
          items:
            $ref: '#/components/schemas/Attribute'
        humanReadableId:
          title: Человекочитаемый идентификатор
          description: Человекочитаемый идентификатор
          type: string
        roles:
          title: Роли
          description: Список ролей
          type: array
          items:
            type: string
            title: Роль
            description: Название роли
        approvals:
          title: Согласования
          description: Количество согласований. Используйте запрос количества согласований пользователя
          deprecated: true
          type: integer
        isDepartmentHead:
          title: Руководитель
          description: Сотрудник это руководитель
          deprecated: true
          type: boolean
        managedDepartments:
          title: Список подчиннных подразделений
          description: Список идентификаторов подчиннных подразделений. Используйте получение подразделений с фильтром по руководителю
          deprecated: true
          type: array
          items:
            title: Идентификатор
            type: string
            format: uuid
        consent:
          title: ПДн подписан
          description: Признак подписания ПДн
          type: boolean
        orgStructureType:
          $ref: '#/components/schemas/StructureType'
        isPhoneConfirmed:
          title: Телефон подтвержден
          description: Признак подтверждения номера телефона
          type: boolean
    Attribute:
      title: Атрибут
      description: Описание атрибута сотрудника
      type: object
      required:
        - id
        - name
      properties:
        id:
          title: Идентификатор
          type: string
          format: uuid
        name:
          title: Наименование
          description: Наименование атрибута
          type: string
          maxLength: 128
          minLength: 1
        status:
          $ref: '#/components/schemas/ActiveStatus'
    StructureType:
      type: string
      format: enum
      title: Тип оргштатки
      description: Допустипые типы оргштатной структуры
      enum:
        - INTERNAL
        - EXTERNAL
    NewOrganizationData:
      type: object
      title: Новые данные организации
      description: Новые данные организации для добавления/изменения
      required:
        - address
        - officialName
        - msrn
        - tid
      properties:
        officialName:
          type: string
          title: Название
          description: Официальное наименование
          minLength: 1
        address:
          type: string
          title: Адрес
          description: Официальный адрес организации
          minLength: 1
        contacts:
          type: array
          title: Контакты
          description: Список контактов
          items:
            $ref: '#/components/schemas/Contact'
        msrn:
          type: string
          title: ОГРН
          description: ОГРН органициции
        organizationCode:
          type: integer
          title: Код
          description: Код организации
        tid:
          type: string
          title: ИНН
          description: Индивидуальный номер налогоплательщика организации
          minimum: 10
          maximum: 12
        easupId:
          type: string
          title: Идентификатор ЕАСУП
          description: Идентификатор организации в единой автоматизированной системе управления пользователями банка
    OrganizationData:
      type: object
      title: Данные организации
      description: Данные организации для добавления/изменения
      required:
        - id
        - address
        - officialName
        - status
        - digitId
        - msrn
        - tid
      properties:
        id:
          title: Идентификатор
          type: string
          format: uuid
        digitId:
          type: integer
          title: Номер организации
          description: Номер организации для идентификации организации пользователем и для составления других человеко-читаемых идентификаторов
        status:
          $ref: '#/components/schemas/ActiveStatus'
        officialName:
          type: string
          title: Название
          description: Официальное наименование
          minLength: 1
        address:
          type: string
          title: Адрес
          description: Официальный адрес организации
          minLength: 1
        contacts:
          type: array
          title: Контакты
          description: Список контактов
          items:
            $ref: '#/components/schemas/Contact'
        msrn:
          type: string
          title: ОГРН
          description: ОГРН органициции
        organizationCode:
          type: integer
          title: Код
          description: Код организации
        tid:
          type: string
          title: ИНН
          description: Индивидуальный номер налогоплательщика организации
          minimum: 10
          maximum: 12
        easupId:
          type: string
          title: Идентификатор ЕАСУП
          description: Идентификатор организации в единой автоматизированной системе управления пользователями банка
        organizationGroup:
          $ref: '#/components/schemas/OrganizationGroup'
    OrganizationGroup:
      title: Группа организаций
      description: Группа организаций
      type: object
      required:
        - id
        - name
        - internal
      properties:
        id:
          title: Идентификатор
          type: string
          format: uuid
        name:
          title: Наименование
          description: Наименование группы организаций
          type: string
          maxLength: 255
        internal:
          title: Внутренний
          description: Признак внутренней группы
          type: boolean
    ActiveStatus:
      title: Статус активности
      description: Статус активности сущностей
      type: string
      format: enum
      default: ACTIVE
      enum:
        - ACTIVE
        - INACTIVE
    Contact:
      type: object
      title: Контакт
      description: Описание контактных данных
      required:
        - type
        - value
      properties:
        type:
          $ref: '#/components/schemas/ContactType'
        value:
          type: string
          title: Значение
          description: Значение контакта
    ContactType:
      type: string
      title: Тип контакта
      description: |-
        Допустимые варианты контактных данных

        |Значение|Описание               |
        |--------|-----------------------|
        |PHONE   |Номер телефона         |
        |EMAIL   |Адрес электронной почты|
        |SITE    |Адрес веб-сайта        |
      format: enum
      enum:
        - PHONE
        - EMAIL
        - SITE
    NotFound:
      description: По указанному URL не найден ресурс
      type: object
      properties:
