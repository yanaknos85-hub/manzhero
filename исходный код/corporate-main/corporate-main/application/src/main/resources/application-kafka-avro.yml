spring.cloud.stream:
  binders:
    kafka-avro:
      type: kafka
      environment:
        spring:
          cloud:
            stream:
              kafka:
                binder:
                  consumerProperties:
                    value.deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
                    key.deserializer: org.apache.kafka.common.serialization.JsonDeserializer
                  producerProperties:
                    value.serializer: ru.sber.transport.messaging.kafka.serialize.KafkaAvroSerialize
                    key.serializer: org.apache.kafka.common.serialization.JsonSerializer
                    schema.registry.service-organization-employee.compatible: NONE
                    schema.registry.service-organization-employee-delegate.compatible: NONE
                    schema.registry.service-organization-position.compatible: NONE
                    schema.registry.service-organization.compatible: NONE
                bindings:
                  organizationsInputAvro-in-0:
                    consumer:
                      ackEachRecord: true
                      configuration.max.poll.records: 100
  bindings:
    organizationsInputAvro-in-0:
      group: ${spring.application.name}-avro
      destination: service-import-organization
      binder: kafka-avro
      content-type: application/*+avro
      consumer:
        useNativeDecoding: true
    organizationsOutputAvro-out-0:
      destination: service-organization
      binder: kafka-avro
      content-type: application/*+avro
      producer:
        useNativeEncoding: true
    employeesOutputAvro-out-0:
      destination: service-organization-employee
      binder: kafka-avro
      content-type: application/*+avro
      producer:
        useNativeEncoding: true
    departmentsOutputAvro-out-0:
      destination: service-organization-department
      binder: kafka-avro
      content-type: application/*+avro
      producer:
        useNativeEncoding: true
    positionOutputAvro-out-0:
      destination: service-organization-position
      binder: kafka-avro
      content-type: application/*+avro
      producer:
        useNativeEncoding: true
    delegateOutputAvro-out-0:
      destination: service-organization-employee-delegate
      binder: kafka-avro
      content-type: application/*+avro
      producer:
        useNativeEncoding: true