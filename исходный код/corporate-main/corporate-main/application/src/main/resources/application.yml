grpc:
  client:
    GLOBAL:
      negotiation-type: plaintext
    easup:
      address: discovery:/grpc-integration-easup
    files:
      address: discovery:/grpc-files-v2
  server:
    port: 6565
server:
  port: 8007
spring:
  config:
    import:
      - optional:configserver:${spring.cloud.config.uri}
  jackson:
    default-property-inclusion: non_null
  application:
    name: corporate-service
  cloud:
    vault:
      enabled: false
  datasource:
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      schema: corporate
      maximum-pool-size: 50
      minimum-idle: 1
      idle-timeout: 10000
  jpa:
    properties:
      hibernate:
        search:
          enabled: false
        jdbc:
          lob:
            non_contextual_creation: true
          batch_size: 25
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  liquibase:
    change-log: db/changelog-master.yml
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    database-change-log-table: changelog_corporate
    database-change-log-lock-table: changelog_corporate_lock
    liquibase-schema: ${MIGRATIONS_SCHEMA:public}
    default-schema: corporate
  profiles:
    active: kafka-avro,import
  servlet:
    multipart:
      enabled: true
      max-file-size: ${file.max-size}
      max-request-size: ${file.max-size}
file:
  max-size: ${FILE_MAX_SIZE_REQUEST:20971520}
organization:
  logo:
    allowedTypes: ${ORGANIZATION_LOGO_ALLOWED_TYPES:image/bmp,image/gif,image/ico,image/jpg,image/jpeg,image/png,image/svg,image/tiff,image/webp}
    path: ${ORGANIZATION_LOGO_PATH:images/organizations/logo}
management:
  health.db.enabled: false
config:
  delayUpdateAutoApproveFlag: ${DELAY_UPDATE_AUTOAPPROVE_FLAG_MIN:5}
  delayDelegateDeadlineDisactivationHours: ${DELAY_DELEGATE_DEADLINE_DISACTIVATION_HOURS:2}
addresses:
  host: ${ADDRESSES_HOST:http://address:8080/}
rest-template.request:
  default-max-per-route: ${REST_TEMPLATE_REQUEST_MAX_PER_ROUTE:5}
  max-total: ${REST_TEMPLATE_REQUEST_TOTAL_MAX:5}

openapi:
  corporate:
    base-path: /

