databaseChangeLog:
  - changeSet:
      id: "20240930-1003"
      author: "morgan-nm"
      context: "TRANSPORT-26003"
      changes:
        - tagDatabase:
            tag: "D-03.020.000"
        - createTable:
            schemaName: corporate
            tableName: executor_group
            remarks: Группа исполнителей.
            columns:
              - column:
                  name: id
                  type: uuid
                  remarks: Идентификатор
                  constraints:
                    primaryKeyName: executor_group_pkey
                    primaryKey: true
              - column:
                  name: humanreadableid
                  type: varchar(16)
                  remarks: Человеко-читаемый идентификатор.
                  constraints:
                    nullable: false
              - column:
                  name: service
                  type: varchar(50)
                  remarks: Услуга.
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(150)
                  remarks: Наименование группы.
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: boolean
                  remarks: Состояние.
                  constraints:
                    nullable: false
              - column:
                  name: creation_time
                  type: timestamp
                  remarks: Дата и время создания в UTC.
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  remarks: Дата и время изменения в UTC.
                  constraints:
                    nullable: false
              - column:
                  name: author_id
                  type: uuid
                  remarks: Идентификатор инициатора.
                  constraints:
                    foreignKeyName: executor_group_author_id_fk
                    referencedTableName: employee
                    referencedColumnName: id
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  remarks: Идентификатор последнего модификатора.
                  constraints:
                    foreignKeyName: executor_group_user_id_fk
                    referencedTableName: employee
                    referencedColumnName: id
                    nullable: false
              - column:
                  name: service_level
                  type: varchar(50)
                  remarks: Уровень сервиса.
                  constraints:
                    nullable: true
              - column:
                  name: organization_id
                  type: uuid
                  remarks: Идентификатор организации исполнителей.
                  constraints:
                    foreignKeyName: executor_group_organization_id_fk
                    referencedTableName: organization
                    referencedColumnName: id
                    nullable: false
        - createIndex:
            schemaName: corporate
            tableName: executor_group
            columns:
              - column:
                  name: name
            indexName: corporate_executor_group_name_idx
        - createIndex:
            schemaName: corporate
            tableName: executor_group
            columns:
              - column:
                  name: service_level
            indexName: corporate_executor_group_service_level_idx
      rollback:
        - dropTable:
            schemaName: corporate
            tableName: executor_group

