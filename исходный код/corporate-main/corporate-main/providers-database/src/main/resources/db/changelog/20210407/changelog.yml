        - createTable:
            schemaName: corporate
            tableName: request_deadline_settings_item
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: corporate_request_deadline_settings_item_pk
              - column:
                  name: request_status
                  type: varchar(255)
              - column:
                  name: transport_type
                  type: varchar(255)
              - column:
                  name: unit
                  type: varchar(255)
                  constraints:
                    nullable: false
                    notNullConstraintName: corporate_request_deadline_settings_item_unit_nn
              - column:
                  name: value
                  type: int2
                  constraints:
                    nullable: false
                    notNullConstraintName: corporate_request_deadline_settings_item_value_nn
                    check: value >= 1 and value <= 999
        - createTable:
            schemaName: corporate
            tableName: limit_deadline_settings_item
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
