            - tableExists:
                schemaName: corporate
                tableName: deadline_settings_item
          onFail: MARK_RAN
      changes:
        - tagDatabase:
            tag: D-03.020.001
        - createTable:
            schemaName: corporate
            tableName: deadline_settings_item
            remarks: 'Элемент Настройки контрольных сроков для организации'
            columns:
              - column:
                  name: item_type
                  type: varchar(31)
                  remarks: 'Тип элемента (discriminator column)'
              - column:
                  name: id
                  type: uuid
                  remarks: 'ID элемента настройки'
                  constraints:
                    primaryKey: true
                    primaryKeyName: corporate_deadline_settings_item_pk
              - column:
                  name: transport_type
                  type: varchar(255)
                  remarks: 'Тип транспорта'
              - column:
                  name: request_status
                  type: varchar(255)
                  remarks: 'Cтатус заявки на поездку'
              - column:
                  name: limit_type
                  type: varchar(255)
                  remarks: 'Тип лимита'
              - column:
                  name: carsharing_join_status
                  type: varchar(255)
                  remarks: 'Статус заявки на подключение к корп. каршерингу'
              - column:
                  name: unit
                  type: varchar(255)
                  remarks: 'Единица измерения времени'
                  constraints:
                    nullable: false
                    notNullConstraintName: corporate_deadline_settings_item_unit_nn
              - column:
                  name: value
                  type: int2
                  remarks: 'Значение контрольного срока (в указанных ед.изменрения)'
                  constraints:
                    nullable: false
                    notNullConstraintName: corporate_deadline_settings_item_value_nn
                    check: value >= 1 and value <= 990
