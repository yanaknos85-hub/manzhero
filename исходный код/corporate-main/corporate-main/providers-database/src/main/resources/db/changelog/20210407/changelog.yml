                  constraints:
                    nullable: false
                    notNullConstraintName: corporate_limit_deadline_settings_item_unit_nn
              - column:
                  name: value
                  type: int2
                  constraints:
                    nullable: false
                    notNullConstraintName: corporate_limit_deadline_settings_item_value_nn
                    check: value >= 1 and value <= 999
        - createTable:
