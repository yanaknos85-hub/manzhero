databaseChangeLog:
  - changeSet:
      id: "20230906-1050"
      author: blandin-ad
      context: "20230906"
      changes:
        - tagDatabase:
            tag: "20230906"
        - createTable:
            schemaName: corporate
            tableName: organization_group
            columns:
              - column:
                  name: id
                  type: uuid
                  remarks: ID группы организаций
                  constraints:
                    primaryKey: true
                    primaryKeyName: organization_group_pk
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  remarks: Наименование группы организаций
                  constraints:
                    unique: true
                    uniqueConstraintName: organization_group_name_uk
                    nullable: false
              - column:
                  name: internal
                  type: boolean
                  remarks: Принадлежность к внутренней группе компаний
                  constraints:
                    nullable: false
        - addColumn:
            schemaName: corporate
            tableName: organization
            columns:
              - column:
                  name: organization_group_id
                  type: uuid
                  remarks: ID группы организаций
        - addForeignKeyConstraint:
            baseTableSchemaName: corporate
            baseTableName: organization
            baseColumnNames: organization_group_id
            constraintName: ogranization_group_organization_fk
            referencedTableSchemaName: corporate
            referencedTableName: organization_group
            referencedColumnNames: id
      rollback:
        - dropForeignKeyConstraint:
            baseTableSchemaName: corporate
            baseTableName: organization
            constraintName: ogranization_group_organization_fk
        - dropColumn:
            schemaName: corporate
            tableName: organization
            columns:
              - column:
                  name: organization_group_id
        -  dropTable:
             schemaName: corporate
             tableName: organization_group
