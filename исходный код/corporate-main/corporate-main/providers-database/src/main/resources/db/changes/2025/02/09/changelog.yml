databaseChangeLog:
  - changeSet:
      id: "20250209-1328"
      author: medvedev-ad
      context: "TRANSPORT-29751"
      changes:
        - tagDatabase:
            tag: "D-03.024.003"
        - sql:
            sql: create schema corporate_sync
        - sql:
            sql: comment on schema corporate_sync is 'Промежуточные данные синхронизации'
  - changeSet:
      id: "20250209-1329"
      author: medvedev-ad
      context: "TRANSPORT-29751"
      changes:
        - tagDatabase:
            tag: "D-03.024.003"
        - createTable:
            schemaName: corporate_sync
            tableName: sync_organization
            remarks: 'Данные организаций для синхронизации'
            columns:
              - column:
                  name: sync_id
                  type: varchar(20)
                  remarks: 'Идентификатор синхронизации'
                  constraints:
                    primaryKey: true
                    primaryKeyName: corporate_sync_organization_pk
              - column:
                  name: id
                  type: uuid
                  remarks: 'Внутренний идентификатор'
                  constraints:
                    unique: true
                    uniqueName: corporate_sync_organization_id_uk
        - addForeignKeyConstraint:
            baseTableSchemaName: corporate_sync
            baseTableName: sync_organization
            baseColumnNames: id
            referencedTableSchemaName: corporate
            referencedTableName: organization
            referencedColumnNames: id
            constraintName: corporate_sync_organization_fk
  - changeSet:
      id: "20250209-1340"
      author: medvedev-ad
      context: "TRANSPORT-29751"
      changes:
        - tagDatabase:
            tag: "D-03.024.003"
        - sql:
            sql: insert into corporate_sync.sync_organization (sync_id, id) (select easup_id, id from corporate.easup_organization)
  - changeSet:
      id: "20250209-1341"
      author: medvedev-ad
      context: "TRANSPORT-29751"
      changes:
        - tagDatabase:
            tag: "D-03.024.003"
        - dropForeignKeyConstraint:
            baseTableSchemaName: corporate
            baseTableName: sync_tasks
            baseColumnNames: organization_id
            referencedTableSchemaName: corporate
            referencedTableName: easup_organization
            referencedColumnNames: easup_id
            constraintName: corporate_sync_tasks_organization_fk
  - changeSet:
      id: "20250209-1342"
      author: medvedev-ad
      context: "TRANSPORT-29751"
      changes:
        - tagDatabase:
            tag: "D-03.024.003"
        - dropTable:
            schemaName: corporate
            tableName: easup_organization
  - changeSet:
      id: "20250209-1344"
      author: medvedev-ad
      context: "TRANSPORT-29751"
      changes:
        - tagDatabase:
            tag: "D-03.024.003"
        - sql:
            sql: create type corporate_sync.sync_state as enum ('NOT_READY', 'READY', 'SYNCHRONIZED')
        - sql:
            sql: create type corporate_sync.sync_itinerant as enum ('NONE', 'PARTIAL', 'FULL')
        - sql:
            sql: create type corporate_sync.sync_gender as enum ('MALE', 'FEMALE')
  - changeSet:
      id: "20250209-1345"
      author: medvedev-ad
      context: "TRANSPORT-29751"
      dbms: postgresql
      changes:
        - tagDatabase:
            tag: "D-03.024.003"
        - sql:
            sql: comment on type corporate_sync.sync_state is 'Состояние синхронизации (NOT_READY - не готов, READY - готов, SYNCHRONIZED - синхронизирован)'
        - sql:
            sql: comment on type corporate_sync.sync_itinerant is 'Тип разъездного характера (NONE - нет, PARTIAL - частичный, FULL - полный)'
        - sql:
            sql: comment on type corporate_sync.sync_gender is 'Пол (MALE - мужской, FEMALE - женский)'
  - changeSet:
