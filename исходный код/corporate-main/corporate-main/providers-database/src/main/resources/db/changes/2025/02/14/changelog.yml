        - addUniqueConstraint:
            schemaName: corporate
            tableName: department
            columnNames: organization_id,sync_id
            constraintName: corporate_department_organization_sync_uk
        - addUniqueConstraint:
            schemaName: corporate
            tableName: position
            columnNames: organization_id,sync_id
            constraintName: corporate_department_position_sync_uk
        - addUniqueConstraint:
            schemaName: corporate
            tableName: organization
            columnNames: sync_id
