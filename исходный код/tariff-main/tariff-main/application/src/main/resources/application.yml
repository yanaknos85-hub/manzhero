server:
    port: 8067
spring:
    config:
        import: ${SPRING_CONFIGURATION_IMPORT:database.yml, kafka.yml, management.yml}
    security:
        user: #убираем запись в логах, по которой есть вопросы у безопасности
            name: anonymous
            password: ${random.uuid}
            roles: anonymous
        oauth2:
            resourceserver:
                jwt:
                    jws-algorithms: RS512
                    jwk-set-uri: ${JWKS_URI}
    main:
        banner-mode: off
    jackson:
        serialization:
            write_dates_as_timestamps: false
    application:
        name: tariff-fleet
        version: @project.version@ #used in Main.class
    servlet:
        multipart:
            enabled: true
            max-file-size: 30MB
            max-request-size: 30MB
grpc:
    server:
        port: 6565
    client:
        GLOBAL:
            negotiation-type: plaintext
        grpc-files-v2:
            max-inbound-message-size: 6MB
            max-outbound-message-size: 6MB
            address: discovery:/grpc-files-v2
        grpc-ewb:
            address: discovery:/grpc-ewb
        grpc-fleet-fuel:
            address: discovery:/grpc-fleet-fuel
scheduler:
    contract:
        activation:
            cron: ${CONTRACT_ACTIVATION_CRON:0 0 0 * * *}
            lock-at-least-for: ${CONTRACT_ACTIVATION_LOCK_AT_LEAST_FOR:PT1H}
            lock-at-most-for: ${CONTRACT_ACTIVATION_LOCK_AT_MOST_FOR:PT1H}
        deactivation:
            cron: ${CONTRACT_DEACTIVATION_CRON:0 0 0 * * *}
            lock-at-least-for: ${CONTRACT_DEACTIVATION_LOCK_AT_LEAST_FOR:PT1H}
            lock-at-most-for: ${CONTRACT_DEACTIVATION_LOCK_AT_MOST_FOR:PT1H}
service-points:
    excel:
        max-file-size: ${SERVICE_POINTS_EXCEL_MAX_FILE_SIZE:1536KB} #1.5MB
        max-row-count: ${SERVICE_POINTS_EXCEL_MAX_ROW_COUNT:1000}
files:
    content-max-length: 10485760