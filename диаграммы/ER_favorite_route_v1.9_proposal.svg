<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1408" viewBox="0 0 1200 1408" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1200" height="1500" fill="#fff"/><rect x="307" y="12" width="430" height="1208" fill="#fff" stroke="#5b7b78" stroke-width="1.2"/><text x="316" y="31" font-size="12.5" fill="#3d5a57" style="" text-anchor="start">Сервис избранных маршрутов (схема favorite_route)</text><rect x="325" y="45" width="392" height="584.5" fill="#fff" stroke="#111" stroke-width="1.8"/><rect x="325" y="45" width="392" height="30" fill="#d6e8f5" stroke="#111" stroke-width="1.8"/><text x="521.0" y="65" font-size="15" fill="#111" style="font-weight:700;" text-anchor="middle">favorite_route</text><text x="335" y="96.85" font-size="13"><tspan fill="#111" style="font-weight:700;">PK id</tspan><tspan fill="#111" style="font-weight:700;"> : uuid</tspan></text><text x="335" y="118.55" font-size="13"><tspan fill="#111" style="">favorite_route_number</tspan><tspan fill="#111" style=""> : varchar(20) UNIQUE</tspan></text><text x="335" y="140.25" font-size="13"><tspan fill="#111" style="">route_name</tspan><tspan fill="#111" style=""> : varchar(255)</tspan></text><text x="335" y="161.95" font-size="13"><tspan fill="#111" style="">waypoints</tspan><tspan fill="#111" style=""> : jsonb</tspan><tspan fill="#b45309" style="font-weight:700;"> *</tspan><tspan fill="#0b6fb8" style="font-style:italic;">  структура справа</tspan></text><text x="335" y="183.65" font-size="13"><tspan fill="#111" style="">transport_type</tspan><tspan fill="#111" style=""> : varchar(50)</tspan></text><text x="335" y="205.35" font-size="13"><tspan fill="#111" style="">service_class</tspan><tspan fill="#111" style=""> : varchar(50)</tspan></text><text x="335" y="227.04999999999998" font-size="13"><tspan fill="#0b6fb8" style="">total_km</tspan><tspan fill="#0b6fb8" style=""> : numeric(7,3) (км)</tspan></text><text x="335" y="248.75" font-size="13"><tspan fill="#0b6fb8" style="">travel_time</tspan><tspan fill="#0b6fb8" style=""> : numeric(6,1) (мин)</tspan></text><text x="335" y="270.45000000000005" font-size="13"><tspan fill="#0b6fb8" style="">total_time</tspan><tspan fill="#0b6fb8" style=""> : numeric(6,1) (мин)</tspan></text><text x="335" y="292.15" font-size="13"><tspan fill="#111" style="">recommended_cost</tspan><tspan fill="#111" style=""> : int4 (коп)</tspan></text><text x="335" y="313.85" font-size="13"><tspan fill="#111" style="">fixed_cost</tspan><tspan fill="#111" style=""> : int4 (коп)</tspan></text><text x="335" y="335.55" font-size="13"><tspan fill="#111" style="">is_night_tariff</tspan><tspan fill="#111" style=""> : boolean</tspan></text><text x="335" y="357.25" font-size="13"><tspan fill="#111" style="">valid_from</tspan><tspan fill="#111" style=""> : date</tspan></text><text x="335" y="378.95" font-size="13"><tspan fill="#111" style="">valid_to</tspan><tspan fill="#111" style=""> : date</tspan></text><text x="335" y="400.65000000000003" font-size="13"><tspan fill="#111" style="">is_active</tspan><tspan fill="#111" style=""> : boolean</tspan></text><text x="335" y="422.35" font-size="13"><tspan fill="#0b6fb8" style="">tariff_id</tspan><tspan fill="#0b6fb8" style=""> : uuid  (снимок на момент расчёта)</tspan></text><text x="335" y="444.05" font-size="13"><tspan fill="#111" style="">organization_id</tspan><tspan fill="#111" style=""> : uuid</tspan></text><text x="335" y="465.75" font-size="13"><tspan fill="#111" style="">created_by</tspan><tspan fill="#111" style=""> : uuid</tspan></text><text x="335" y="487.45" font-size="13"><tspan fill="#111" style="">updated_by</tspan><tspan fill="#111" style=""> : uuid</tspan></text><text x="335" y="509.15000000000003" font-size="13"><tspan fill="#111" style="">created_at</tspan><tspan fill="#111" style=""> : timestamptz</tspan></text><text x="335" y="530.85" font-size="13"><tspan fill="#111" style="">updated_at</tspan><tspan fill="#111" style=""> : timestamptz</tspan></text><text x="335" y="552.5500000000001" font-size="13"><tspan fill="#0b6fb8" style="">version</tspan><tspan fill="#0b6fb8" style=""> : int8</tspan></text><text x="335" y="574.25" font-size="13"><tspan fill="#0b6fb8" style="font-style:italic;">Индекс (предл., П6): (organization_id, is_active)</tspan></text><text x="335" y="595.9499999999999" font-size="13"><tspan fill="#0b6fb8" style="font-style:italic;">CHECK (предл., П19): recommended_cost ≥ 0,</tspan></text><text x="335" y="617.65" font-size="13"><tspan fill="#0b6fb8" style="font-style:italic;">   total_km ≥ 0, travel_time ≥ 0, total_time ≥ travel_time</tspan></text><rect x="325" y="677.5" width="392" height="237.29999999999998" fill="#fff" stroke="#111" stroke-width="1.8"/><rect x="325" y="677.5" width="392" height="30" fill="#d6e8f5" stroke="#111" stroke-width="1.8"/><text x="521.0" y="697.5" font-size="15" fill="#111" style="font-weight:700;" text-anchor="middle">favorite_route_history</text><text x="335" y="729.35" font-size="13"><tspan fill="#111" style="font-weight:700;">PK id</tspan><tspan fill="#111" style="font-weight:700;"> : uuid</tspan></text><text x="335" y="751.0500000000001" font-size="13"><tspan fill="#111" style="font-weight:700;">FK favorite_route_id</tspan><tspan fill="#111" style="font-weight:700;"> : uuid</tspan></text><text x="335" y="772.75" font-size="13"><tspan fill="#0b6fb8" style="">route_version</tspan><tspan fill="#0b6fb8" style=""> : int8</tspan><tspan fill="#b45309" style="font-weight:700;"> *</tspan></text><text x="335" y="794.45" font-size="13"><tspan fill="#111" style="">changed_by</tspan><tspan fill="#111" style=""> : uuid</tspan></text><text x="335" y="816.15" font-size="13"><tspan fill="#111" style="">changed_at</tspan><tspan fill="#111" style=""> : timestamptz</tspan></text><text x="335" y="837.85" font-size="13"><tspan fill="#111" style="">field_name</tspan><tspan fill="#111" style=""> : varchar(64)</tspan></text><text x="335" y="859.5500000000001" font-size="13"><tspan fill="#111" style="">old_value</tspan><tspan fill="#111" style=""> : text</tspan></text><text x="335" y="881.25" font-size="13"><tspan fill="#111" style="">new_value</tspan><tspan fill="#111" style=""> : text</tspan></text><text x="335" y="902.95" font-size="13"><tspan fill="#0b6fb8" style="font-style:italic;">UNIQUE (favorite_route_id, field_name, route_version)</tspan></text><polyline points="521.0,677.5 521.0,629.5" fill="none" stroke="#111" stroke-width="1.3"/><polyline points="516.0,638.5 521.0,629.5 526.0,638.5" fill="none" stroke="#111" stroke-width="1.3"/><text x="535.0" y="651.5" font-size="12.5"><tspan fill="#111" style="">1 : N   история изменений</tspan></text><text x="535.0" y="667.5" font-size="12.5"><tspan fill="#111" style="">(EAV, БТ §10.2, </tspan><tspan fill="#0b6fb8" style="">D04</tspan><tspan fill="#111" style="">) </tspan><tspan fill="#b45309" style="font-weight:700;">*</tspan></text><rect x="325" y="960.8" width="392" height="237.29999999999998" fill="#fff" stroke="#0b6fb8" stroke-width="1.8"/><rect x="325" y="960.8" width="392" height="30" fill="#dbeafe" stroke="#0b6fb8" stroke-width="1.8"/><text x="521.0" y="980.8" font-size="15" fill="#0b6fb8" style="font-weight:700;" text-anchor="middle">company_sq (новая)</text><text x="335" y="1012.65" font-size="13"><tspan fill="#0b6fb8" style="font-weight:700;">PK id</tspan><tspan fill="#0b6fb8" style="font-weight:700;"> : uuid</tspan></text><text x="335" y="1034.35" font-size="13"><tspan fill="#0b6fb8" style="">prefix</tspan><tspan fill="#0b6fb8" style=""> : varchar(2)  (значение FR)</tspan></text><text x="335" y="1056.05" font-size="13"><tspan fill="#0b6fb8" style="">orgdigitid</tspan><tspan fill="#0b6fb8" style=""> : numeric  (1…9999)</tspan></text><text x="335" y="1077.7499999999998" font-size="13"><tspan fill="#0b6fb8" style="">sq</tspan><tspan fill="#0b6fb8" style=""> : numeric  (последний номер)</tspan></text><text x="335" y="1099.4499999999998" font-size="13"><tspan fill="#0b6fb8" style="">dt_insert, dt_modify</tspan><tspan fill="#0b6fb8" style=""> : timestamptz</tspan></text><text x="335" y="1121.1499999999999" font-size="13"><tspan fill="#0b6fb8" style="font-style:italic;">логическая связь: orgdigitid = organization.digitId</tspan></text><text x="335" y="1142.85" font-size="13"><tspan fill="#0b6fb8" style="font-style:italic;">образец: request.company_sq; счётчик номера</tspan><tspan fill="#b45309" style="font-weight:700;"> *</tspan></text><text x="335" y="1164.55" font-size="13"><tspan fill="#0b6fb8" style="font-style:italic;">FR-XXXX-XXXXXXXX (генератор, П2); повтор при</tspan></text><text x="335" y="1186.2499999999998" font-size="13"><tspan fill="#0b6fb8" style="font-style:italic;">   конфликте уникальности номера</tspan></text><rect x="28" y="118" width="215" height="150.5" fill="#fff" stroke="#111" stroke-width="1.3"/><rect x="28" y="118" width="215" height="30" fill="#e8e8e8" stroke="#111" stroke-width="1.3"/><text x="135.5" y="138" font-size="15" fill="#666" style="font-weight:700;" text-anchor="middle">tariff (внешний)</text><text x="38" y="169.85" font-size="13"><tspan fill="#666" style="">id : uuid</tspan></text><text x="38" y="191.54999999999998" font-size="13"><tspan fill="#666" style="">freeWaitingTime : int (мин)</tspan></text><text x="38" y="213.25" font-size="13"><tspan fill="#666" style="">…</tspan></text><text x="38" y="234.95" font-size="13"><tspan fill="#666" style="font-style:italic;">← tariff_id</tspan></text><text x="38" y="256.65" font-size="13"><tspan fill="#0b6fb8" style="font-style:italic;">версия меняется (П1)</tspan></text><rect x="28" y="298.5" width="215" height="128.8" fill="#fff" stroke="#111" stroke-width="1.3"/><rect x="28" y="298.5" width="215" height="30" fill="#e8e8e8" stroke="#111" stroke-width="1.3"/><text x="135.5" y="318.5" font-size="15" fill="#666" style="font-weight:700;" text-anchor="middle">organization (внешний)</text><text x="38" y="350.35" font-size="13"><tspan fill="#666" style="">id : uuid</tspan></text><text x="38" y="372.05" font-size="13"><tspan fill="#666" style="">digitId : int</tspan></text><text x="38" y="393.75" font-size="13"><tspan fill="#666" style="">…</tspan></text><text x="38" y="415.45000000000005" font-size="13"><tspan fill="#666" style="font-style:italic;">← organization_id</tspan></text><rect x="28" y="547.3" width="215" height="128.8" fill="#fff" stroke="#111" stroke-width="1.3"/><rect x="28" y="547.3" width="215" height="30" fill="#e8e8e8" stroke="#111" stroke-width="1.3"/><text x="135.5" y="567.3" font-size="15" fill="#666" style="font-weight:700;" text-anchor="middle">users (внешний)</text><text x="38" y="599.15" font-size="13"><tspan fill="#666" style="">id : uuid</tspan></text><text x="38" y="620.85" font-size="13"><tspan fill="#666" style="">…</tspan></text><text x="38" y="642.55" font-size="13"><tspan fill="#666" style="font-style:italic;">← created_by, updated_by</tspan></text><text x="38" y="664.25" font-size="13"><tspan fill="#666" style="font-style:italic;">← changed_by (история)</tspan></text><polyline points="325,418.35 291,418.35 291,169.85 243,169.85" fill="none" stroke="#777" stroke-width="1.3" stroke-dasharray="6,4"/><polyline points="252,164.85 243,169.85 252,174.85" fill="none" stroke="#777" stroke-width="1.3"/><polyline points="325,440.05 275,440.05 275,350.35 243,350.35" fill="none" stroke="#777" stroke-width="1.3" stroke-dasharray="6,4"/><polyline points="252,345.35 243,350.35 252,355.35" fill="none" stroke="#777" stroke-width="1.3"/><polyline points="325,461.75 260,461.75 260,790.45 325,790.45" fill="none" stroke="#777" stroke-width="1.3" stroke-dasharray="6,4"/><polyline points="325,483.45 260,483.45" fill="none" stroke="#777" stroke-width="1.3" stroke-dasharray="6,4"/><polyline points="260,599.15 243,599.15" fill="none" stroke="#777" stroke-width="1.3" stroke-dasharray="6,4"/><polyline points="252,594.15 243,599.15 252,604.15" fill="none" stroke="#777" stroke-width="1.3"/><circle cx="260" cy="599.15" r="3.2" fill="#666"/><circle cx="260" cy="483.45" r="3.2" fill="#666"/><polyline points="325,1056.05 250,1056.05 250,372.05 243,372.05" fill="none" stroke="#0b6fb8" stroke-width="1.3" stroke-dasharray="6,4"/><polyline points="252,367.05 243,372.05 252,377.05" fill="none" stroke="#0b6fb8" stroke-width="1.3"/><text x="255" y="1051.05" font-size="11.5" fill="#0b6fb8" style="font-style:italic;" text-anchor="start">по digitId</text><polyline points="717,1077.7499999999998 731,1077.7499999999998 731,118.55 717,118.55" fill="none" stroke="#0b6fb8" stroke-width="1.3" stroke-dasharray="6,4"/><polyline points="726,113.55 717,118.55 726,123.55" fill="none" stroke="#0b6fb8" stroke-width="1.3"/><text x="742" y="1071.7499999999998" font-size="11.5" fill="#0b6fb8" style="font-style:italic;" text-anchor="start">формирует</text><text x="742" y="1085.7499999999998" font-size="11.5" fill="#0b6fb8" style="font-style:italic;" text-anchor="start">favorite_route_number</text><rect x="770" y="55" width="400" height="193.9" fill="#fff" stroke="#111" stroke-width="1.3"/><rect x="770" y="55" width="400" height="30" fill="#e8e8e8" stroke="#111" stroke-width="1.3"/><text x="970.0" y="75" font-size="15" fill="#666" style="font-weight:700;" text-anchor="middle">заявка (внешняя, T04.1)</text><text x="780" y="106.85" font-size="13"><tspan fill="#0b6fb8" style="font-style:italic;">условно: orders из БТ §10.3</tspan></text><text x="780" y="128.55" font-size="13"><tspan fill="#0b6fb8" style="font-style:italic;">такси и трансфер — разные таблицы;</tspan></text><text x="780" y="150.25" font-size="13"><tspan fill="#0b6fb8" style="font-style:italic;">точки — в request.waypoint</tspan></text><text x="780" y="171.95" font-size="13"><tspan fill="#666" style="">favorite_route_id : uuid</tspan></text><text x="780" y="193.65" font-size="13"><tspan fill="#666" style="">original_fixed_cost</tspan></text><text x="780" y="215.35" font-size="13"><tspan fill="#666" style="">cost_variance_flag</tspan></text><text x="780" y="237.04999999999998" font-size="13"><tspan fill="#666" style="">is_favorite_trip</tspan></text><polyline points="770,170.95 740,170.95 740,96.85 717,96.85" fill="none" stroke="#777" stroke-width="1.3" stroke-dasharray="6,4"/><polyline points="726,91.85 717,96.85 726,101.85" fill="none" stroke="#777" stroke-width="1.3"/><rect x="770" y="308.9" width="400" height="304" fill="#fff" stroke="#0b6fb8" stroke-width="1.6"/><rect x="770" y="308.9" width="400" height="30" fill="#dbeafe" stroke="#0b6fb8" stroke-width="1.6"/><text x="970.0" y="328.9" font-size="14.5" fill="#0b6fb8" style="font-weight:700;" text-anchor="middle">waypoints (jsonb): элемент массива</text><text x="782" y="355.9" font-size="12.5" fill="#666" style="font-style:italic;" text-anchor="start">[ элемент 1 — база (выезд); элемент N — база (возврат);</text><text x="782" y="375.9" font-size="12.5" fill="#666" style="font-style:italic;" text-anchor="start">  3…10 элементов, включая базу ]</text><text x="782" y="395.9" font-size="12.5" fill="#111" style="" text-anchor="start">country : string  (обязательно)</text><text x="782" y="415.9" font-size="12.5" fill="#111" style="" text-anchor="start">region : string  (обязательно)</text><text x="782" y="435.9" font-size="12.5" fill="#111" style="" text-anchor="start">city, street, house : string  (необязательно)</text><text x="782" y="455.9" font-size="12.5" fill="#111" style="" text-anchor="start">building (корпус), structure (строение) : string</text><text x="782" y="475.9" font-size="12.5" fill="#0b6fb8" style="font-style:italic;" text-anchor="start">   необязательно; смысл полей — подтвердить (3.3)</text><text x="782" y="495.9" font-size="12.5" fill="#111" style="" text-anchor="start">latitude : double  (обязательно, −90…90)</text><text x="782" y="515.9" font-size="12.5" fill="#111" style="" text-anchor="start">longitude : double  (обязательно, −180…180)</text><text x="782" y="535.9" font-size="12.5" fill="#0b6fb8" style="" text-anchor="start">waitTime : int64, мс, ≥ 0  — только у промежуточных</text><text x="782" y="555.9" font-size="12.5" fill="#666" style="font-style:italic;" text-anchor="start">   имя и единица утверждены (D02)</text><text x="782" y="575.9" font-size="12.5" fill="#0b6fb8" style="font-style:italic;" text-anchor="start">id адреса и label не хранятся; пустые значения</text><text x="782" y="595.9" font-size="12.5" fill="#0b6fb8" style="font-style:italic;" text-anchor="start">   не записываются (ключ опускается)</text><polyline points="770,460.9 752,460.9 752,160.95 717,160.95" fill="none" stroke="#0b6fb8" stroke-width="1.3" stroke-dasharray="6,4"/><polyline points="726,155.95 717,160.95 726,165.95" fill="none" stroke="#0b6fb8" stroke-width="1.3"/><text x="28" y="1258" font-size="13" fill="#111" style="" text-anchor="start">Сплошная линия — внешний ключ в базе данных.</text><text x="28" y="1280" font-size="12.5" fill="#666" style="" text-anchor="start">Пунктир — связь по значению идентификатора между микросервисами; внешний ключ не создаётся,</text><text x="28" y="1298" font-size="12.5" fill="#666" style="" text-anchor="start">целостность обеспечивает приложение. Серые сущности принадлежат другим сервисам и приведены для контекста.</text><text x="28" y="1320" font-size="12.5" fill="#0b6fb8" style="" text-anchor="start">Заявка показана условно: таблицы orders из БТ §10.3 в платформе нет — заявки такси и группового</text><text x="28" y="1338" font-size="12.5" fill="#0b6fb8" style="" text-anchor="start">трансфера хранятся раздельно, точки — в request.waypoint (T04.1).</text><text x="28" y="1360" font-size="12.5"><tspan fill="#b45309" style="font-weight:700;">* </tspan><tspan fill="#b45309" style="">— предложение, согласовать с архитектором: тип jsonb вместо json (БТ §10.1), история изменений и route_version (D04), таблица company_sq (П2).</tspan></text><text x="28" y="1382" font-size="12.5" fill="#0b6fb8" style="" text-anchor="start">Синим выделены изменения относительно версии 1.8: int8 для version и route_version, пометка у tariff_id, company_sq, индекс, CHECK, структура точки.</text></svg>