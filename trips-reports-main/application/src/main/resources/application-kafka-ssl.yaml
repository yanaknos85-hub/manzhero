spring:
  cloud:
    stream:
      binders:
        kafka-ssl:
          type: kafka
          environment:
            spring.cloud.stream.kafka:
              binder:
                configuration:
                  security.protocol: ${KAFKA_SECURITY_PROTOCOL:SSL}
                  ssl:
                    endpoint.identification.algorithm: ""
                    client.auth: required
                    enabled.protocols: TLSv1.2
                    truststore:
                      location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
                      password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
                    keystore:
                      location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
                      password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
                    key.password: ${KAFKA_SSL_KEY_PASSWORD:}
                brokers:
                  - ${KAFKA_SSL_BROKERS}
                producerProperties:
                  key.serializer: org.springframework.kafka.support.serializer.JsonSerializer
                  value.serializer: org.springframework.kafka.support.serializer.JsonDeserializer
                consumerProperties:
                  value.deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
                defaultBrokerPort: "9093"
      bindings:
        tripReportsInputSsl-in-0:
          group: ${spring.application.name}-ssl
          destination: service.trip.reports
          binder: kafka-ssl