server:
    port: @server.port@
spring:
    main:
        banner-mode: off
    security:
        user:
            name: anonymous
            password: ${random.uuid}
            roles: anonymous
        oauth2:
            resourceserver:
                jwt:
                    jws-algorithms: RS512
                    jwk-set-uri: ${JWKS_URI}
    jackson:
        default-property-inclusion: non_null
    application:
        name: trip_registries
        version: @project.version@
    cloud:
        kubernetes.enabled: false
        consul.enabled: false
        vault.enabled: false
        stream:
            kafka:
                binder:
                    brokers:
                        - ${KAFKA_BROKERS:@kafka.default.broker@}
                    producerProperties:
                        key.serializer: org.springframework.kafka.support.serializer.JsonSerializer
                    consumerProperties:
                        key.deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
            default-binder: kafka
            bindings:
                tripRegistryOutput-out-0:
                    destination: service.trip.registry
    liquibase:
        enabled: true
        change-log: db/changelog-master.yml
        url: ${spring.datasource.url}
        user: ${spring.datasource.username}
        password: ${spring.datasource.password}
        database-change-log-table: changelog_${spring.application.name}
        database-change-log-lock-table: changelog_${spring.application.name}_lock
        liquibase-schema: ${MIGRATIONS_SCHEMA:public}
    profiles:
        active: prod,kafka,logging
config:
    portal:
        baseurl: ${PORTAL_URL:localhost}
        post_registry: ${PATH_POST_REGISTRY:/sapasus/zmms_act_transp/act/}
        act_number: ${PATH_ACT_NUMBER:/sapasus/zmms_act_transp/act/}
        act_status: ${PATH_ACT_STATUS:/sapasus/zmms_act/upd/}
    schedule:
        cron: ${SCHEDULE_CRON:* 0 * * * *}
        delay: ${SCHEDULE_DELAY:60000}
rest-template.request:
    default-max-per-route: ${REST_TEMPLATE_REQUEST_MAX_PER_ROUTE:5}
    max-total: ${REST_TEMPLATE_REQUEST_TOTAL_MAX:5}
grpc:
    server:
        port: 6565
